# 容灾演练临时工具（演练后删除）— 第三轮：双线路（default+oversea）黑洞
# action=status    查看 www default/oversea A 记录
# action=blackhole  www default+oversea → 203.0.113.1 (RFC5737 测试网段，不可路由 = 黑洞)
# action=restore   恢复 www default+oversea → 快照 IP（默认参数）
# action=restore-line  仅恢复指定线路: restore-line <default|oversea> [ip1,ip2,...]
name: 容灾演练·黑洞
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'status | blackhole | restore | restore-line'
        required: true
        default: 'status'
      line:
        description: 'restore-line 目标线路'
        required: false
        default: 'default'
      ips:
        description: 'restore-line 目标 IP 列表（逗号分隔，留空用快照）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装阿里云 SDK
        run: pip install -q alibabacloud_alidns20150109
      - name: 执行 DNS 操作
        env:
          ALI_KEY_ID: ${{ secrets.ALI_ACCESS_KEY_ID }}
          ALI_KEY_SECRET: ${{ secrets.ALI_ACCESS_KEY_SECRET }}
          ACTION: ${{ github.event.inputs.action }}
          LINE: ${{ github.event.inputs.line }}
          TARGET_IPS: ${{ github.event.inputs.ips }}
        run: |
          python3 - <<'PY'
          import os, sys
          from alibabacloud_alidns20150109.client import Client
          from alibabacloud_alidns20150109 import models as m
          from alibabacloud_tea_openapi import models as oa

          DOMAIN = "chenxiuniverse.top"
          SNAPSHOT = {
              "default": ["172.64.52.95", "162.159.44.17", "162.159.39.168"],
              "oversea": ["104.19.184.186", "104.21.93.71", "172.66.216.152"],
          }
          BLACKHOLE = ["203.0.113.1"]

          client = Client(oa.Config(
              access_key_id=os.environ["ALI_KEY_ID"],
              access_key_secret=os.environ["ALI_KEY_SECRET"],
              region_id="cn-hangzhou",
          ))
          client._endpoint = "alidns.cn-hangzhou.aliyuncs.com"

          def get_records(line):
              req = m.DescribeDomainRecordsRequest(domain_name=DOMAIN, rrkey_word="www", type_key_word="A", line=line)
              resp = client.describe_domain_records(req)
              body = resp.body.domain_records if resp.body else None
              return [{"id": r.record_id, "value": r.value}
                      for r in (body.record if body else [])
                      if r.rr == "www" and r.type == "A" and r.line == line]

          def set_ips(line, ips, ttl, label):
              recs = get_records(line)
              cur = [r["value"] for r in recs]
              if sorted(cur) == sorted(ips):
                  print(f"  ({line}) 无变更（已是 {label}）: {cur}")
                  return
              ids = [r["id"] for r in recs]
              aborted = False
              for i, ip in enumerate(ips):
                  try:
                      if i < len(ids):
                          client.update_domain_record(m.UpdateDomainRecordRequest(
                              record_id=ids[i], rr="www", type="A", value=ip, line=line, ttl=ttl))
                          print(f"  ({line}) 更新 #{i+1}: {cur[i] if i < len(cur) else '?'} -> {ip}")
                      else:
                          client.add_domain_record(m.AddDomainRecordRequest(
                              domain_name=DOMAIN, rr="www", type="A", value=ip, line=line, ttl=ttl))
                          print(f"  ({line}) 新增 #{i+1}: {ip}")
                  except Exception as e:
                      print(f"  ⚠ ({line}) 操作失败: {e}", file=sys.stderr)
                      aborted = True
                      break
              for j in range(len(ips), len(ids)):
                  try:
                      client.delete_domain_record(m.DeleteDomainRecordRequest(record_id=ids[j]))
                      print(f"  ({line}) 删除多余: {cur[j]}")
                  except Exception as e:
                      print(f"  ⚠ ({line}) 删除失败: {e}", file=sys.stderr)
              print(f"{'⚠ 未完整完成' if aborted else 'OK'} ({line}) {label}: {ips}")

          action = os.environ["ACTION"]
          if action == "status":
              for line in ("default", "oversea"):
                  print(f"www {line}:", [r["value"] for r in get_records(line)])
          elif action == "blackhole":
              for line in ("default", "oversea"):
                  print(f"💥 黑洞 www {line} -> {BLACKHOLE}")
                  set_ips(line, BLACKHOLE, 600, "黑洞")
          elif action == "restore":
              for line in ("default", "oversea"):
                  print(f"♻ 恢复 www {line} -> {SNAPSHOT[line]}")
                  set_ips(line, SNAPSHOT[line], 600, "恢复")
          elif action == "restore-line":
              line = os.environ.get("LINE", "default")
              if line not in SNAPSHOT:
                  print(f"非法线路: {line}", file=sys.stderr)
                  sys.exit(1)
              target = [x.strip() for x in os.environ.get("TARGET_IPS", "").split(",") if x.strip()]
              ips = target or SNAPSHOT[line]
              print(f"♻ 恢复 www {line} -> {ips}")
              set_ips(line, ips, 600, "恢复")
          else:
              print(f"未知 action: {action}", file=sys.stderr)
              sys.exit(1)
          PY
