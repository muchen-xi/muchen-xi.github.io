name: 容灾监控补检
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'   # 每5分钟，偏移2分钟，错开例行检查
  workflow_dispatch:           # 手动触发

permissions:
  actions: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 检查上次例行容灾监控是否被放弃
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/failover-monitor.yml/runs?per_page=1" --jq '.workflow_runs[0]')
          EVENT=$(echo "$LAST" | jq -r '.event')
          CONCL=$(echo "$LAST" | jq -r '.conclusion')
          echo "上次运行: event=$EVENT conclusion=$CONCL"
          # 只对 schedule 触发的失败/取消补检（runner 不可用、任务被放弃）；
          # 补检本身是 workflow_dispatch，失败不再重补，避免死循环
          if [ "$EVENT" = "schedule" ] && { [ "$CONCL" = "failure" ] || [ "$CONCL" = "cancelled" ]; }; then
            echo "→ 例行检查被放弃（runner 不可用），触发补检"
            gh api "repos/${{ github.repository }}/actions/workflows/failover-monitor.yml/dispatches" \
              -f ref=main -f 'inputs[compensate]=true'
          else
            echo "→ 无需补检"
          fi
